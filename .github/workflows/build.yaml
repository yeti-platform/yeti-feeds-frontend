name: Build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # 24 is what docker/prod/Dockerfile builds with. 26 is tested so the
      # image can be moved onto it deliberately, rather than discovering the
      # jump only after a floating base image has already shipped it.
      matrix:
        node: [22, 24, 26]
    name: Node ${{ matrix.node }} sample
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
